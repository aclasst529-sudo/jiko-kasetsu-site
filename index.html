<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自己仮説</title>
<style>
:root{
  --bg:#F2EEE7; --ink:#1C1815; --sub:#6E665D; --line:#DDD5C8;
  --accent:#8C2F2B; --card:#FFFDF9; --accent-soft:#F6E4DE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120F; --ink:#EFE9E0; --sub:#A79E92; --line:#332C25;
    --accent:#D9776E; --card:#1D1916; --accent-soft:#2C1B18;
  }
}
:root[data-theme="dark"]{
  --bg:#15120F; --ink:#EFE9E0; --sub:#A79E92; --line:#332C25;
  --accent:#D9776E; --card:#1D1916; --accent-soft:#2C1B18;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;
  min-height:100%;line-height:1.7;
  background-image:
    radial-gradient(ellipse 800px 600px at -5% -5%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
    radial-gradient(ellipse 700px 500px at 105% 105%, rgba(0,0,0,.05), transparent 60%),
    repeating-linear-gradient(118deg, rgba(0,0,0,.012) 0px, rgba(0,0,0,.012) 1px, transparent 1px, transparent 3px);
  background-attachment:fixed;}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px;}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.stamp{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  border:1.5px solid var(--accent);color:var(--accent);font-family:"Noto Serif JP",serif;
  font-size:16px;transform:rotate(-3deg);border-radius:1px;}
.brushline{width:68px;height:3px;margin:12px 0 22px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,transparent 100%);opacity:.85;}
h1{font-family:"Noto Serif JP",serif;font-weight:700;font-size:28px;letter-spacing:.04em;margin:0 0 6px;}
.lede{color:var(--sub);font-size:14px;margin:0 0 28px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:26px 22px;
  margin-bottom:16px;position:relative;box-shadow:0 2px 16px rgba(0,0,0,.04);}
.card::before,.card::after{content:"";position:absolute;width:13px;height:13px;opacity:.55;}
.card::before{top:0;left:0;border-top:1.5px solid var(--accent);border-left:1.5px solid var(--accent);}
.card::after{bottom:0;right:0;border-bottom:1.5px solid var(--accent);border-right:1.5px solid var(--accent);}
.qcard{border-left:3px solid var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.06);}
.qcard::before,.qcard::after{display:none;}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:none;border-radius:2px;
  padding:14px 22px;font-size:15px;font-family:inherit;cursor:pointer;width:100%;text-align:center;
  letter-spacing:.04em;box-shadow:0 3px 12px rgba(0,0,0,.16);border-bottom:2px solid var(--accent);
  transition:transform .1s,opacity .1s;}
.btn:active{opacity:.9;transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;
  border-bottom:1px solid var(--line);}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:10px;
  font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;}
.opt:active,.opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt.none{color:var(--sub);font-size:13px;border-style:dashed;}
.optnum{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:"Noto Serif JP",serif;
  font-size:12px;color:var(--sub);}
.opt:active .optnum,.opt.sel .optnum{border-color:var(--accent);color:var(--accent);}
.qhead{color:var(--sub);font-size:12px;margin-bottom:10px;}
.seal{display:inline-flex;align-items:center;gap:6px;font-family:"Noto Serif JP",serif;
  font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:2px;
  padding:3px 10px;margin-bottom:14px;letter-spacing:.08em;}
.qtext{font-family:"Noto Serif JP",serif;font-size:19px;font-weight:500;line-height:1.85;
  margin-bottom:24px;letter-spacing:.02em;}
.bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:24px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
.type-code{font-family:"Noto Serif JP",serif;font-size:44px;font-weight:700;letter-spacing:.06em;
  color:var(--accent);margin:6px 0 4px;}
.axisrow{margin:16px 0;}
.axislabel{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:6px;}
.axistrack{height:8px;background:var(--line);border-radius:4px;position:relative;}
.axisdot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--accent);}
.hidden{display:none;}
.foot{color:var(--sub);font-size:12px;margin-top:30px;line-height:1.8;}
.pillrow{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 10px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
