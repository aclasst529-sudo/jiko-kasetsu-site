  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">

<script>
/* ---------- 質問データ v2 ----------
   8つの内部パラメータを連続値として測定する。
   12刻は固定的な性格分類ではなく、8軸の全体像から得られる象徴ラベル。
   0/1は優劣ではなく、各軸の左右方向を示す。
------------------------------------- */
const PARAMS = {
  "CN": {
    "name": "接続",
    "left": "一人で整う",
    "right": "人との接触で整う"
  },
  "JR": {
    "name": "判断基準",
    "left": "自分の納得",
    "right": "外部の反応"
  },
  "CL": {
    "name": "確定性",
    "left": "答えを固める",
    "right": "可能性を残す"
  },
  "EX": {
    "name": "探索性",
    "left": "安定・既知",
    "right": "変化・未知"
  },
  "TH": {
    "name": "思考様式",
    "left": "直感・即時処理",
    "right": "熟考・分析"
  },
  "RA": {
    "name": "対人自律",
    "left": "自分を優先",
    "right": "関係を優先"
  },
  "AC": {
    "name": "行動速度",
    "left": "慎重に動く",
    "right": "まず動く"
  },
  "SF": {
    "name": "自己可変性",
    "left": "一貫した自分",
    "right": "状況で変わる自分"
  }
};

const Q = [
  ["CN","かなり疲れている時、気持ちを戻すために最初に欲しくなるのは？",["誰にも合わせなくていい一人の時間", "安心できる相手と気楽に過ごす時間"]],
  ["CN","考えがまとまらず頭がいっぱいになった時、整理しやすいのは？",["一人で考えたり書き出したりする時", "誰かに話しながら考える時"]],
  ["CN","予定や刺激が多かった日の終わり、落ち着きやすいのは？",["一人になって自分のペースに戻ること", "気を使わない相手と過ごすこと"]],
  ["CN","予想外の出来事で気持ちが乱れた時、立て直しやすいのは？",["少し一人になって状況を整理すること", "信頼できる相手とやり取りすること"]],
  ["CN","人と長く過ごして少し消耗した後は？",["一人になる時間があると回復しやすい", "気の合う人と過ごし続けても回復できる"]],
  ["CN","落ち込んだ時、気分が戻り始めるきっかけになりやすいのは？",["自分の中で気持ちを整理できた時", "誰かとのやり取りで気持ちがほぐれた時"]],
  ["CN","忙しさが続いて余裕がなくなった時、休みとして効きやすいのは？",["予定も会話も少ない静かな時間", "安心できる人と肩の力を抜いて過ごす時間"]],
  ["CN","大きな判断を終えて緊張が解けた後、自然に戻りやすいのは？",["一人で余韻を整理している時", "誰かと話しながら気持ちをほどく時"]],
  ["JR","自分の仕事や作品が良かったか判断する時、最後に頼りやすいのは？",["自分の中で納得できたか", "周囲からどう評価されたか"]],
  ["JR","周囲から高く評価されても、自分では納得できない時は？",["自分の違和感を重く見る", "高く評価された事実を重く見る"]],
  ["JR","誰にも見られない作業の出来を判断するなら？",["自分で決めた基準に届いたかを見る", "人に見せた時どう受け取られるかを想像する"]],
  ["JR","服や持ち物を選ぶ時、最後の決め手になりやすいのは？",["自分自身がしっくりくるか", "周囲から好意的に見られそうか"]],
  ["JR","自分では良いと思った案に反応がほとんどなかった時は？",["良いと思う理由が残っていれば評価を保ちやすい", "反応が弱いと自分の評価も下がりやすい"]],
  ["JR","失敗した後、自分の出来を振り返る時に基準になりやすいのは？",["自分が目指していた水準との差", "周囲から返ってきた反応との差"]],
  ["JR","目標を達成した時、満足感を強く左右しやすいのは？",["自分が納得するところまで到達した実感", "人に認められたという実感"]],
  ["JR","他人から助言をもらった後、最終判断を決める時は？",["助言を踏まえても自分の基準で決める", "助言した人たちの反応を強く参考にして決める"]],
  ["CL","情報が足りないまま考え続ける必要がある時は？",["仮でも一度結論を置くと考えやすい", "結論を置かず複数の可能性を残して考えられる"]],
  ["CL","二つの説明がどちらも一理ある時は？",["今の時点でより妥当な方を選びたい", "両方を候補として持ったままにできる"]],
  ["CL","結論の出ない話し合いが長く続くと？",["どこかで区切りとなる答えが欲しくなる", "答えが決まらなくてもそれほど気にならない"]],
  ["CL","自分の考えが途中で何度も変わっている時は？",["いったん一本に整理すると落ち着く", "変わり続けている状態でも考え続けられる"]],

  ["EX","自由時間に何か見るものを選ぶなら？",["以前から好きなジャンルを選びやすい", "普段触れないジャンルも試したくなる"]],

  ["EX","日常が安定してうまく回っている時は？",["そのリズムを保てることに心地よさを感じる", "新しい刺激を少し入れたくなる"]],
  ["EX","今すぐ役立つか分からない分野を見つけた時は？",["必要になるまでは深く触れないことが多い", "役立つか分からなくても知りたくなる"]],
  ["EX","初めての店と気に入っている店が並んでいたら？",["気に入っている店を選ぶことが多い", "初めての店にも惹かれやすい"]],
  ["EX","新しい道具やサービスを知った時は？",["今のものに不満がなければあまり気にならない", "違いが何なのか触れて確かめたくなる"]],
  ["EX","趣味で時間を使うなら？",["好きだと分かっていることを深めたい", "まだ知らないものにも触れてみたい"]],
  ["EX","知らない考え方に出会った時は？",["自分に必要かどうかを先に考える", "まずどういう考えなのか知りたくなる"]],
  ["TH","初めて見たものの良し悪しを判断する時、自然なのは？",["第一印象から方向を掴むこと", "理由を整理してから判断すること"]],
  ["TH","難しい問題に出会った時、取りかかりやすいのは？",["まず感覚的に当たりをつけること", "要素を分けて構造を整理すること"]],
  ["TH","説明を受けて『分かった』と感じやすいのは？",["全体像や要点が感覚的につかめた時", "理由や仕組みまでつながった時"]],
  ["TH","選択肢が多い買い物では？",["ある程度見たところで感覚的に絞る", "比較軸を作って違いを整理する"]],
  ["TH","自分の意見を人に説明する時は？",["まず結論や感覚を伝える", "なぜそう考えたか順序立てて伝える"]],
  ["TH","問題が起きた時、頭の中で先に起こりやすいのは？",["使えそうな対処法が浮かぶ", "原因や仕組みを整理したくなる"]],
  ["TH","一度結論が出た後でも？",["実用上十分ならそこで考えるのを止めやすい", "別の可能性や反例まで考えたくなる"]],
  ["RA","親しい相手と意見が違う時、優先しやすいのは？",["違いが残っても自分の考えを正確に伝えること", "自分の表現を調整して関係を保つこと"]],

  ["RA","相手が不快に感じる可能性のある意見を伝える時は？",["必要なら内容を優先して伝える", "内容を弱めても関係への影響を減らす"]],
  ["RA","親しい人の希望と自分の予定がぶつかった時は？",["まず自分の予定をどこまで守るか考える", "まず相手の希望にどこまで合わせられるか考える"]],

  ["AC","良さそうな案を思いついた時、始め方として自然なのは？",["必要な条件を整理してから着手する", "小さく試してから必要な条件を考える"]],

  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  return {order, answers:{}, pos:0, started_at:Date.now(), question_started_at:Date.now(), response_times:{}};
}

function renderQuestion(app){
  const idx = state.order[state.pos];
  const [axis, text, opts] = Q[idx];
  const options = opts ? opts.map((label,i)=>({label,value:i})) : [];
  if(Math.random() < 0.5) options.reverse();
  const total = Q.length;
  app.innerHTML = `<header class="topbar"><div class="brand"><div class="brandmark"></div><div><div class="brandtitle">自己仮説</div><div class="brandsub">SELF HYPOTHESIS</div></div></div><div class="qhead">ANALYSIS IN PROGRESS</div></header>

      <div class="seal">${PARAMS[axis]?.name || 'QUESTION'}</div>
      <div class="qcard"><p class="qtext">${text}</p><div id="opts"></div></div>
      <p class="foot">どちらにも当てはまらない場合は「どちらとも言えない」を選べます。</p>
    </main>`;
  const optsEl = app.querySelector('#opts');
  const marks = ["A","B"];
  options.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="optnum">${marks[i]||i+1}</span><span>${opt.label}</span>`;b.onclick=()=>answer(idx,axis,opt.value);optsEl.appendChild(b);});
  const noneBtn=document.createElement('button');noneBtn.className='opt none';noneBtn.textContent=NONE;noneBtn.onclick=()=>answer(idx,axis,null);optsEl.appendChild(noneBtn);
}

function answer(idx, axis, value){
  const now = Date.now();
  state.response_times[idx] = Math.max(0, now - (state.question_started_at || now));
  state.answers[idx] = {axis, value};
  state.pos += 1;
  state.question_started_at = Date.now();
  saveState(state);
  render();
}

function computeScores(){
  const sums = {};
  Object.keys(PARAMS).forEach(k => sums[k] = [0,0]);
  Q.forEach((q, idx)=>{
    const a = state.answers[idx];
    if(!a || a.value===null || !sums[a.axis]) return;
    sums[a.axis][a.value]++;
  });
  return sums;
}

function ratioOf(s, axis){
  const v = s[axis] || [0,0];
  const total = v[0] + v[1];
  return total ? v[1] / total : 0.5;
}

function strengthWord(r){
  const d = Math.abs(r - 0.5);
  if(d < 0.08) return "中間";
  if(d < 0.18) return "やや";
  if(d < 0.30) return "明瞭";
  return "かなり明瞭";
}

  },

  }
];

function profileValues(s){
  return Object.fromEntries(Object.keys(PARAMS).map(k=>[k,ratioOf(s,k)]));
}

function axisDirectionText(axis, r){
  const detail = AXIS_DETAIL[axis];
  const side = r >= 0.5 ? detail.high : detail.low;
  const strength = Math.abs(r-0.5);
  return strength >= 0.30 ? `${side.core} ${side.strong}` : side.core;
}

function buildNarrative(s, derived){
  const v = profileValues(s);
  const ranked = Object.keys(PARAMS)
    .map(axis=>({axis,r:v[axis],dev:Math.abs(v[axis]-0.5)}))
    .sort((a,b)=>b.dev-a.dev);

  const strongest = ranked.filter(x=>x.dev>=0.12).slice(0,4);
  const core = strongest.length
    ? strongest.map(x=>axisDirectionText(x.axis,x.r))
    : ["どれか一方向に強く偏るというより、複数の傾向を状況に応じて使い分ける輪郭が出ています。"];

  const interactions = INTERACTION_TEXT
    .filter(x=>x.when(v))
    .map(x=>x.text)
    .slice(0,2);

  // 強い軸の「行き過ぎた時」を1つだけ出す。弱点断定ではなく注意点として扱う。
  const strongestAxis = ranked[0];
  let caution = "";
  if(strongestAxis && strongestAxis.dev >= 0.20){
    const d = AXIS_DETAIL[strongestAxis.axis];
    caution = (strongestAxis.r>=0.5 ? d.high : d.low).stress;
  }

  let boundary = "";
  if(derived.margin < 0.025){
    boundary = `今回もっとも近かった象徴は「${derived.type.name}」ですが、「${derived.secondType}」との距離も近く、一つの刻だけでは説明しきれない境界的な輪郭があります。`;
  }else{
    boundary = `今回の回答全体では「${derived.type.name}」が最も近い象徴でした。ただし、これはあなたを固定する分類ではなく、現在の輪郭を12の象徴の中で表したものです。`;
  }

  return {
    opening: boundary,
    core,
    interactions,
    caution
  };
}

function renderNarrative(n){
  const paragraphs = [
    n.opening,
    ...n.core,
    ...n.interactions,
    n.caution
  ].filter(Boolean);

  return paragraphs.map((p,i)=>{
    if(i===0) return `<p style="font-size:15px;line-height:2;margin:0 0 18px;">${p}</p>`;
    return `<p style="font-size:14px;color:var(--ink);line-height:2;margin:0 0 14px;">${p}</p>`;
  }).join("");
}


function profileDistance(s, proto){
  // 8軸すべてを同じ重みで扱う暫定距離。
  // 実データが蓄積したら、各軸の識別力に応じて重みを学習・更新する。
  const axes = Object.keys(PARAMS);
  const mse = axes.reduce((acc, axis)=>{
    const d = ratioOf(s, axis) - proto[axis];
    return acc + d*d;
  }, 0) / axes.length;
  return Math.sqrt(mse);
}

function deriveType(s){
  const ranked = Object.entries(TYPES).map(([legacyKey, t])=>{
    const proto = ARCHETYPE_PROFILES[t.name];
    return {
      legacyKey,
      type:t,
      distance:profileDistance(s, proto)
    };
  }).sort((a,b)=>a.distance-b.distance);

  const best = ranked[0];
  const second = ranked[1];

  // 表には出さない24前後の潜在サブパターン。
  // 同じ刻の中で「熟考・慎重寄り(A) / 可変・実行寄り(B)」のどちらへ
  // 相対的に傾くかを補助4軸から判定する。固定人格名は与えない。
  const inward =
    (ratioOf(s,"TH") + (1-ratioOf(s,"AC")) + (1-ratioOf(s,"RA")) + (1-ratioOf(s,"SF"))) / 4;
  const hiddenVariant = inward >= 0.5 ? "A" : "B";

  // 1位と2位が近いほど境界的。数値は内部保存のみ。
  const margin = Math.max(0, second.distance - best.distance);

  return {
    type:best.type,
    hiddenVariant,
    nearestDistance:best.distance,
    secondType:second.type.name,
    secondDistance:second.distance,
    margin,
    ranked:ranked.slice(0,3).map(x=>({name:x.type.name, order:x.type.order, distance:x.distance}))
  };
}

function describeProfile(s, derived){
  return buildNarrative(s, derived);
}

function parameterBar(axis, r){
  const p = PARAMS[axis];
  const pos = Math.max(2, Math.min(98, r*100));
  const tendency = r < 0.42 ? p.left : (r > 0.58 ? p.right : "両方の傾向");
  return `<div class="axisrow">
    <div class="axislabel"><span>${p.name}</span><span>${tendency}</span></div>
    <div class="axislabel" style="font-size:10px;"><span>${p.left}</span><span>${p.right}</span></div>
    <div class="axistrack"><div class="axisdot" style="left:calc(${pos}% - 7px)"></div></div>
  </div>`;
}


function telemetrySummary(){
  const times = state.response_times || {};
  const vals = Object.values(times).filter(v=>Number.isFinite(v) && v>=0);
  const skipped = Object.values(state.answers || {}).filter(a=>a && a.value===null).length;
  return {
    started_at: state.started_at || null,
    finished_at: Date.now(),
    total_duration_ms: state.started_at ? Date.now()-state.started_at : null,
    answered_count: Object.keys(state.answers || {}).length,
    skipped_count: skipped,
    response_times_ms: times,
    median_response_ms: vals.length ? vals.slice().sort((a,b)=>a-b)[Math.floor(vals.length/2)] : null
  };
}

function serializeAnswers(){
  return Q.map((q, idx)=>{
    const a = state.answers[idx];
    return {
      question_id: idx + 1,
      axis: q[0],
      value: a ? a.value : null
    };
  });
}

function renderResult(app){
  const s = computeScores();
  const derived = deriveType(s);
  const t = derived.type;
  const profileText = describeProfile(s, derived);
  if(!state.submitted){
    state.submitted = true; saveState(state);
    postJSON("/submit", {
      version:"2.5", session_id:getSessionId(), type_code:t.name, type_order:t.order, item_set:"2026-09-v2.1",
      hidden_variant:derived.hiddenVariant, axis_bin:null, archetype_model:"nearest-prototype-8d-v0.1", second_type:derived.secondType,
      type_margin:derived.margin, nearest_types:derived.ranked, scores:s,
      parameters:Object.fromEntries(Object.keys(PARAMS).map(k=>[k,ratioOf(s,k)])), answers:serializeAnswers(),
      profile_signature:Object.fromEntries(Object.keys(PARAMS).map(k=>[k,ratioOf(s,k)])),
      narrative_flags:INTERACTION_TEXT.filter(x=>x.when(profileValues(s))).map((x,i)=>i), telemetry:telemetrySummary()
    });
  }
  document.documentElement.style.setProperty('--accent', t.color);
  document.documentElement.style.setProperty('--accent2', t.color);
  document.documentElement.style.setProperty('--glow', t.color+'55');
  app.innerHTML = `<header class="topbar"><div class="brand"><div class="brandmark"></div><div><div class="brandtitle">自己仮説</div><div class="brandsub">SELF HYPOTHESIS</div></div></div><div class="qhead">ANALYSIS RESULT</div></header>
    <section class="result-hero"><div class="result-hero-bg" style="background-image:url('${TYPE_ASSETS[t.name]}')"></div><div class="result-content">
      <div class="result-order">第${JP_ORDINAL[t.order-1]}刻</div><div class="result-name">${t.name}</div><div class="result-en">${t.en}</div>
      <div class="result-tagline">${t.tagline}</div><p class="result-note">12刻はあなたを固定する分類ではなく、今回の回答全体に最も近い象徴です。</p>
    </div></section>
    <div class="result-grid"><div class="card"><div class="card-title">あなたの全体像</div>${renderNarrative(profileText)}<p style="font-size:12px;color:var(--sub);margin-top:18px;">同じ刻でも、内部の8つの傾向は人によって異なります。そのため説明や対人相性が同じになるとは限りません。</p></div>
    <div class="card"><div class="card-title">傾向の輪郭</div>${Object.keys(PARAMS).map(k=>parameterBar(k,ratioOf(s,k))).join('')}</div></div>
    <div class="card" id="fbcard" style="margin-top:14px"><div class="card-title">この結果は、実際の自分とどの程度近いですか？</div><p style="font-size:12px;color:var(--sub);margin-bottom:14px;">回答は質問・判定・説明文の改善に使われます。</p>
      <div style="display:grid;grid-template-columns:1fr;gap:8px;" id="overallfb">${[[5,"かなり近い"],[4,"だいたい近い"],[3,"どちらとも言えない"],[2,"少し違う"],[1,"かなり違う"]].map(([v,l])=>`<button class="opt" style="margin:0;" onclick="setOverallFb(${v},this)">${l}</button>`).join('')}</div>
      <div id="detailfb" class="hidden" style="margin-top:18px;"><p style="font-size:13px;margin-bottom:10px;">特にどう感じましたか？ <span style="color:var(--sub);font-size:11px;">任意・複数可</span></p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">${[["core","自分の特徴の捉え方"],["relation","対人・距離感"],["decision","判断や考え方"],["action","行動の仕方"],["caution","注意点・弱点の説明"],["archetype","刻のイメージ"]].map(([k,l])=>`<button class="pill fbtag" type="button" data-key="${k}" onclick="toggleFbTag(this)">${l}</button>`).join('')}</div><textarea id="fbtext" maxlength="300" placeholder="違和感があった部分や、もっと知りたいことがあれば自由にどうぞ（任意）" style="width:100%;min-height:90px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:inherit;resize:vertical;"></textarea><button class="btn" style="margin-top:12px;" onclick="submitDetailedFeedback()">フィードバックを送る</button></div><p id="fbthanks" class="hidden" style="font-size:12px;color:var(--sub);margin-top:12px;">記録しました。ありがとうございます。</p>
    </div><button class="btn ghost" style="margin-top:14px;" onclick="restart()">もう一度受ける</button><p class="foot">この診断は仮説段階のツールです。断定的な性格判定ではありません。回答とフィードバックは質問・判定ロジックの精度改善に使われます。</p>`;
}
let feedbackDraft = {overall:null, tags:[]};

function setOverallFb(value, btn){
  feedbackDraft.overall = value;
  document.querySelectorAll('#overallfb .opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('detailfb').classList.remove('hidden');
}

function toggleFbTag(btn){
  const key = btn.dataset.key;
  btn.classList.toggle('sel');
  if(btn.classList.contains('sel')){
    if(!feedbackDraft.tags.includes(key)) feedbackDraft.tags.push(key);
  }else{
    feedbackDraft.tags = feedbackDraft.tags.filter(x=>x!==key);
  }
}

function submitDetailedFeedback(){
  if(!feedbackDraft.overall) return;
  const text = (document.getElementById('fbtext')?.value || "").trim();
  const s = computeScores();
  const derived = deriveType(s);
  const narrative = buildNarrative(s, derived);
  postJSON("/feedback", {
    version:"2.4",
    session_id:getSessionId(),
    feedback_kind:"result_review",
    overall:feedbackDraft.overall,
    tags:feedbackDraft.tags,
    free_text:text || null,
    type_code:derived.type.name,
    type_order:derived.type.order,
    second_type:derived.secondType,
    type_margin:derived.margin,
    parameters:profileValues(s),
    narrative_snapshot:{
      opening:narrative.opening,
      core:narrative.core,
      interactions:narrative.interactions,
      caution:narrative.caution
    }
  });
  document.getElementById('detailfb').classList.add('hidden');
  document.getElementById('overallfb').style.pointerEvents = 'none';
  document.getElementById('overallfb').style.opacity = '.6';
  document.getElementById('fbthanks').classList.remove('hidden');
}

function restart(){
  document.documentElement.style.removeProperty('--accent');
  localStorage.removeItem(KEY);
  state = loadState();
  render();
}

document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveState(state); });
window.addEventListener('pagehide', ()=> saveState(state));
render();
</script>
